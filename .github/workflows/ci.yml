name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔐 Run BuildConfig security check
        run: bash scripts/check-buildconfig-security.sh

  # ── Static Analysis ───────────────────────────────────────────────────────────
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔍 Run Detekt
        run: ./gradlew detekt --no-daemon
        env:
          CI: true

  # ── Unit Tests ────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: 📱 Install Android SDK components
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🧪 Run Unit Tests
        id: tests
        run: ./gradlew testDebugUnitTest --no-daemon
        env:
          CI: true
        continue-on-error: true

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ github.run_number }}
          path: '**/build/test-results/**/*.xml'
          retention-days: 14


      - name: 🚨 Fail if any tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  # ── Coverage Gate ─────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Gate (≥60% on :domain and :data)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: 📱 Install Android SDK components
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 📊 Verify coverage gates (per-module ratchet floors)
        run: >-
          ./gradlew :domain:koverVerify :data:koverVerify :core:database:koverVerify
          :feature:reader:koverVerify :feature:tracking:koverVerify :feature:settings:koverVerify
          --no-daemon
        env:
          CI: true

      - name: 📈 Generate Kover HTML reports
        if: always()
        run: ./gradlew :domain:koverHtmlReport :data:koverHtmlReport --no-daemon
        env:
          CI: true

      - name: 📤 Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports-${{ github.run_number }}
          path: |
            domain/build/reports/kover/html/
            data/build/reports/kover/htmlDebug/
          retention-days: 14

  # ── Assemble ─────────────────────────────────────────────────────────────────
  # The single debug build for the whole PR. Previously this work was duplicated
  # across build.yml and build_preview.yml, so every PR ran assembleDebug three
  # times for one artifact. Those workflows were removed and their only unique
  # behaviour — the preview APK comment — folded in below.
  assemble:
    name: Assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: 📱 Install Android SDK components
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔨 Build Debug
        run: ./gradlew assembleDebug --no-daemon
        env:
          CI: true

      - name: 🏷️ Resolve version info
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "unknown")
          {
            echo "version=$VERSION"
            echo "commit=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: 📊 Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # Posts (or updates) a single preview-build comment on the PR. Unlike the
      # old build_preview.yml this edits its previous comment instead of adding a
      # new one on every push, so long-running PRs don't accumulate duplicates.
      - name: 💬 Comment preview build on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_COMMIT: ${{ steps.version.outputs.commit }}
        with:
          script: |
            const MARKER = '<!-- otaku-reader-preview-build -->';
            const runUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              MARKER,
              '## 📱 Preview build',
              '',
              `Version \`${process.env.APP_VERSION}\` · commit \`${process.env.APP_COMMIT}\``,
              '',
              `[Download the debug APK](${runUrl}) — see the \`app-debug-${context.runNumber}\` artifact.`,
              '',
              'Artifacts are retained for 7 days.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(MARKER),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Screenshot Tests ──────────────────────────────────────────────────────────
  screenshot-tests:
    name: Screenshot Tests (Roborazzi)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: 📱 Install Android SDK components
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0"

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🖼️ Verify screenshot goldens
        run: |
          ./gradlew \
            :feature:library:testDebugUnitTest \
            :feature:reader:testDebugUnitTest \
            -Proborazzi.test.verify=true \
            --tests "app.otakureader.feature.library.screenshot.*" \
            --tests "app.otakureader.feature.reader.screenshot.*" \
            --no-daemon
        env:
          CI: true

      - name: 📤 Upload screenshot diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshot-diffs-${{ github.run_number }}
          path: |
            feature/library/build/outputs/roborazzi/
            feature/reader/build/outputs/roborazzi/
          retention-days: 7

  # ── Ktlint ───────────────────────────────────────────────────────────────────
  ktlint:
    name: Ktlint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🎨 Run ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon
        env:
          CI: true

  # ── Dependency License Report ─────────────────────────────────────────────────
  license-report:
    name: Dependency License Report
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 📋 Generate Dependency License Report
        run: ./gradlew :app:generateLicenseReport --no-daemon
        env:
          CI: true

      - name: 📤 Upload License Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-licenses-${{ github.run_number }}
          path: docs/DEPENDENCY_LICENSES.md
          retention-days: 90
